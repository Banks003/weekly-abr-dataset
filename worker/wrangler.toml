name = "abr-api"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Public r2.dev URL for the bucket — used as a stable HTTPS read source
# until DuckDB-WASM-over-R2-binding is wired up.
[vars]
DATA_BASE_URL = "https://gazetteer.au"

# R2 binding for the published bucket. Available at env.DATA_BUCKET.
[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "weekly-abr-dataset"

# R2 Data Catalog binding (Iceberg) — wired once we have a stable token
# and DuckDB-WASM read support.
# [r2_data_catalog]
# binding = "ICEBERG_CATALOG"
# bucket_name = "weekly-abr-dataset"

[observability]
enabled = true
