name: refresh

on:
  schedule:
    - cron: "0 4 * * 0"  # Sundays 04:00 UTC (Sunday afternoon AEST)
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if source extract is unchanged"
        required: false
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CATALOG_ACCESS_ID_KEY: ${{ secrets.R2_CATALOG_ACCESS_ID_KEY }}
          R2_CATALOG_SECRET_ACCESS_KEY: ${{ secrets.R2_CATALOG_SECRET_ACCESS_KEY }}
          R2_BUCKET: weekly-abr-dataset
        run: |
          uv run abr-extract run --output-dir ./work ${{ inputs.force && '--force' || '' }}
