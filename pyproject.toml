[project]
name = "abr-extract"
version = "0.1.0"
description = "Weekly Parquet and SQLite mirror of the Australian Business Register bulk extract"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Banks003" }]
dependencies = [
    "lxml>=5.3.0",
    "polars>=1.20.0",
    "pyarrow>=18.0.0",
    "httpx>=0.28.0",
    "click>=8.1.0",
    "boto3>=1.35.0",
    "tqdm>=4.66.0",
    "pyiceberg[pyarrow,sql-sqlite]>=0.7",
]

[project.scripts]
abr-extract = "abr_extract.cli:main"

[dependency-groups]
dev = [
    "duckdb>=1.5.2",
    "moto[s3]>=5.2.0",
    "psutil>=7.2.2",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abr_extract"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
